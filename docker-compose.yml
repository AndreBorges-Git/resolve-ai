services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/resolveai
      - PORT=3000
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongo

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - api

volumes:
  mongo-data:
