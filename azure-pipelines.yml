# Azure Pipelines — multi-stage (Fase 5, Aulas 3 e 4)
#
# Organizacao: dev.azure.com/RM365669 · projeto: resolve-ai
# Ja provisionados na organizacao:
#   - Conexao Azure Resource Manager  -> svc-azure
#   - Conexao Docker Registry (ACR)   -> acr-resolveai
#   - Grupo de variaveis              -> resolveai
#
# No Caminho B (sem Azure), vale o .github/workflows/ci.yml.

trigger:
  branches:
    include: [main]

variables:
  - group: resolveai
  - name: imageApi
    value: 'resolveai-api'
  - name: imageWeb
    value: 'resolveai-web'

stages:
  - stage: Build
    displayName: Build e testes
    jobs:
      - job: testes
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm install
            workingDirectory: api
            displayName: 'API - instalar dependencias'
          - script: npm test
            workingDirectory: api
            displayName: 'API - testes'
            env:
              JWT_SECRET: ci-secret
          - script: npm install && npm run build
            workingDirectory: web
            displayName: 'Front - build'
            env:
              VITE_API_URL: $(apiUrl)

  - stage: Push
    displayName: Publicar imagens no ACR
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: docker
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'API - build e push'
            inputs:
              containerRegistry: 'acr-resolveai'
              repository: '$(imageApi)'
              command: 'buildAndPush'
              Dockerfile: 'api/Dockerfile'
              buildContext: 'api'
              tags: |
                $(Build.BuildId)
                latest

          # O front vai em dois passos porque o Vite congela import.meta.env
          # na compilacao: a URL da API precisa entrar como argumento de build,
          # e o buildAndPush nao repassa argumentos.
          - task: Docker@2
            displayName: 'Front - build'
            inputs:
              containerRegistry: 'acr-resolveai'
              repository: '$(imageWeb)'
              command: 'build'
              Dockerfile: 'web/Dockerfile.prod'
              buildContext: 'web'
              arguments: '--build-arg VITE_API_URL=$(apiUrl)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Front - push'
            inputs:
              containerRegistry: 'acr-resolveai'
              repository: '$(imageWeb)'
              command: 'push'
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    displayName: Deploy nos Web Apps for Containers
    dependsOn: Push
    condition: succeeded()
    jobs:
      - deployment: api
        displayName: 'API'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'producao'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  inputs:
                    azureSubscription: 'svc-azure'
                    appName: '$(webAppName)'
                    containers: '$(acrLoginServer)/$(imageApi):$(Build.BuildId)'

      - deployment: front
        displayName: 'Front'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'producao'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  inputs:
                    azureSubscription: 'svc-azure'
                    appName: '$(webAppNameWeb)'
                    containers: '$(acrLoginServer)/$(imageWeb):$(Build.BuildId)'
