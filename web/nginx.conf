server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Os arquivos com hash no nome nunca mudam de conteudo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router trata as rotas no cliente: qualquer caminho cai no index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
