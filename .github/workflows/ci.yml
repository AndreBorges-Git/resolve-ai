name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API - testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: api
      # A suite roda sem banco e sem rede: nao ha MONGODB_URI aqui de proposito.
      - run: npm test
        working-directory: api
        env:
          JWT_SECRET: ci-secret
          PORT: 3000

  web:
    name: Front - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_API_URL: https://resolve-ai-api.azurewebsites.net/api
